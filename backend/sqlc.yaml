# sqlc configuration. Regenerate with `sqlc generate` (from backend/).
# Generated code lives in internal/db and must never be edited by hand.
version: "2"
sql:
  - engine: postgresql
    schema: internal/database/migrations
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_db_tags: true
        emit_result_struct_pointers: false
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: pg_catalog.date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: pg_catalog.date
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
